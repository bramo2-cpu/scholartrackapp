name: Daily Web Scholarship Aggregator

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch latest scholarships from web feeds
        run: python scripts/update_scholarships.py
      - name: Commit updated scholarships.json
        run: |
          git config user.name "ScholarTrack Bot"
          git config user.email "bot@scholartrackapp.local"
          git add scholarships.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update scholarships from web" && git push)
